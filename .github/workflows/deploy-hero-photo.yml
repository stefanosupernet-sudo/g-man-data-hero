name: Deploy hero photo
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hero images
        run: |
          cat assets/_hero_webp_0.b64 assets/_hero_webp_1.b64 assets/_hero_webp_2.b64 | base64 -d > assets/gman-hero.webp
          cat assets/_hero_jpg_0.b64 assets/_hero_jpg_1.b64 assets/_hero_jpg_2.b64 | base64 -d > assets/gman-hero.jpg
          file assets/gman-hero.webp assets/gman-hero.jpg
          ls -la assets/gman-hero.*
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gman-hero.webp assets/gman-hero.jpg
          git commit -m "feat: update hero photo square WebP/JPG (mobile-friendly 800x800)" || echo "No changes"
          git push
