name: Assemble pillars
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode
        run: |
          set -e
          mkdir -p servizi/google-ads servizi/google-analytics-4 servizi/merchant-center-feed servizi/tag-manager-tracking servizi/consulenza-strategica-ai
          cat assets/_g0_0.b64 assets/_g0_1.b64 | base64 -d | gunzip > servizi/google-ads/index.html
          cat assets/_g1_0.b64 assets/_g1_1.b64 | base64 -d | gunzip > servizi/google-analytics-4/index.html
          cat assets/_g2_0.b64 assets/_g2_1.b64 | base64 -d | gunzip > servizi/merchant-center-feed/index.html
          cat assets/_g3_0.b64 assets/_g3_1.b64 | base64 -d | gunzip > servizi/tag-manager-tracking/index.html
          cat assets/_g4_0.b64 assets/_g4_1.b64 | base64 -d | gunzip > servizi/consulenza-strategica-ai/index.html
          for p in servizi/*/index.html; do echo $p $(wc -c < $p); head -c 50 $p; echo; done
          rm -f assets/_g*_*.b64
      - name: Commit
        run: |
          git config user.name stefanosupernet-sudo
          git config user.email stefanosupernet@gmail.com
          git add servizi/
          git add -u assets/_g*_*.b64 || true
          git status
          git diff --staged --quiet || (git commit -m "feat: publish 5 service pillar pages" && git push)
