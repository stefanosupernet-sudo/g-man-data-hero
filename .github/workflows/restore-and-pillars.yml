          curl -sL "https://raw.githubusercontent.com/stefanosupernet-sudo/g-man-data-hero/${GOOD}/servizi/index.html" -o servizi/index.html
          curl -sL "https://raw.githubusercontent.com/stefanosupernet-sudo/g-man-data-hero/${GOOD}/sitemap.xml" -o sitemap.xml
          grep -q PLACEHOLDER index.html && exit 1 || true
          # Inject nav.css/js if missing
          if ! grep -q 'nav.css' index.html; then
            sed -i 's|<link rel="stylesheet" href="/assets/home.css" />|<link rel="stylesheet" href="/assets/home.css" />\n  <link rel="stylesheet" href="/assets/nav.css" />\n  <script src="/assets/nav.js" defer></script>|' index.html
          fi
