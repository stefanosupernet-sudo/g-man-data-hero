# append more links after each service card closing p before </div>
import re
def add_link(html, title, href):
    # find card with h3 title and add link before closing div of that card if not present
    if href in html and 'Scopri il servizio' in html and href in html[html.find(title):html.find(title)+500]:
        return html
    pattern = rf'(<h3>{re.escape(title)}</h3>\s*<p>.*?</p>)\s*</div>'
    repl = rf'\1\n            <a class="more" href="{href}" style="display:inline-block;margin-top:.65rem;color:var(--accent);font-weight:600">Scopri il servizio →</a>\n          </div>'
    html2, n = re.subn(pattern, repl, html, count=1, flags=re.S)
    print(title, 'links added', n)
    return html2
for t,h in [
