from pathlib import Path
html = Path('servizi/index.html').read_text()
# Add more links under each h2 section if missing
links = {
'Google Ads': '/servizi/google-ads/',
'Google Analytics 4': '/servizi/google-analytics-4/',
'Merchant Center e Feed': '/servizi/merchant-center-feed/',
'Tag Manager e Tracking': '/servizi/tag-manager-tracking/',
'Consulenza strategica e AI': '/servizi/consulenza-strategica-ai/',
}
for title, href in links.items():
    if href in html:
        continue
    needle = f'<h2>{title}</h2>'
    if needle in html:
        html = html.replace(needle, needle + f'\n      <p><a href="{href}">Apri la guida completa del servizio →</a></p>', 1)
        print('hub link', title)
Path('servizi/index.html').write_text(html)
