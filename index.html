  <style>
    :root{--bg:#0a0e1a;--bg-card:#111827;--bg-input:#1a2234;--border:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--primary:#ff4d2e;--primary-hover:#ff6347;--accent:#22d3ee;--whatsapp:#25d366;--font-display:"Bebas Neue",system-ui,sans-serif;--font-body:"Barlow",system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}img{max-width:100%;height:auto;display:block}
    .container{width:100%;max-width:1280px;margin:0 auto;padding:0 1.25rem}
    header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
    .logo{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-size:1.35rem;letter-spacing:.04em;white-space:nowrap}
    .logo img{width:36px;height:36px;border-radius:8px}.logo span.accent{color:var(--accent)}
    nav{display:none;align-items:center;gap:1.5rem;font-size:.9rem;font-weight:500;color:var(--text-muted)}nav a:hover{color:var(--text)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:var(--font-body);font-weight:600;font-size:.9rem;border-radius:.5rem;border:none;cursor:pointer;transition:transform .15s,background .15s}
    .btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--primary);color:#fff;padding:.65rem 1.25rem}.btn-primary:hover{background:var(--primary-hover)}
    .btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:.6rem 1.2rem}.btn-header{padding:.5rem 1rem;font-size:.85rem}
    .hero{position:relative;padding:4rem 0 3rem;overflow:hidden;background:radial-gradient(ellipse 80% 50% at 70% 20%,rgba(255,77,46,.12),transparent),radial-gradient(ellipse 60% 40% at 20% 80%,rgba(34,211,238,.08),transparent),linear-gradient(180deg,#0a0e1a 0%,#0d1220 100%)}
    .hero-grid{display:grid;grid-template-columns:1fr;gap:2.5rem;position:relative;z-index:1}
    @media(min-width:1024px){nav{display:flex}.hero-grid{grid-template-columns:1.15fr .85fr;align-items:start;gap:3rem}}
    .badge{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .85rem;border-radius:999px;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.08);color:var(--accent);font-size:.8rem;font-weight:500;margin-bottom:1.25rem}
    h1{font-family:var(--font-display);font-size:clamp(2.4rem,5.5vw,3.75rem);line-height:1.05;letter-spacing:.02em;margin-bottom:1.25rem}h1 .highlight{color:var(--primary)}
    .hero-lead{color:var(--text-muted);font-size:1.05rem;max-width:34rem;margin-bottom:1.75rem}
    .hero-ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.5rem}
    .trust-row{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;font-size:.85rem;color:var(--text-muted);align-items:center}
    .hero-visual{margin-top:2rem;border-radius:1rem;overflow:hidden;border:1px solid var(--border);max-width:420px}
    .form-card{background:rgba(17,24,39,.85);border:1px solid var(--border);border-radius:1rem;padding:1.5rem}
    .form-card h2{font-family:var(--font-display);font-size:1.5rem;margin-bottom:.35rem}
    .form-group{margin-bottom:1rem}.form-group label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.4rem}
    .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:.5rem;padding:.7rem .85rem;color:var(--text);font-family:var(--font-body);font-size:.9rem}
    section{padding:4.5rem 0}.section-label{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.5rem}
    .section-title{font-family:var(--font-display);font-size:clamp(1.8rem,3.5vw,2.5rem);letter-spacing:.03em;margin-bottom:.75rem}.section-lead{color:var(--text-muted);max-width:40rem;margin-bottom:2.5rem}

    @media(min-width:768px){.why-grid,.process-steps{grid-template-columns:1fr 1fr}.cases-grid{grid-template-columns:1fr 1fr}}
    @media(min-width:1024px){.services-grid{grid-template-columns:repeat(3,1fr)}.process-steps{grid-template-columns:repeat(4,1fr)}.cases-grid{grid-template-columns:repeat(3,1fr)}}
    .why-card,.service-card,.case-card,.step{background:var(--bg-card);border:1px solid var(--border);border-radius:.85rem;padding:1.5rem}
    .about-grid{display:grid;gap:2.5rem;align-items:center}@media(min-width:900px){.about-grid{grid-template-columns:320px 1fr;gap:3rem}}
    .about-photo{border-radius:1rem;overflow:hidden;border:1px solid var(--border);max-width:320px;margin:0 auto}
    .faq-list{max-width:48rem;display:flex;flex-direction:column;gap:.75rem}details{background:var(--bg-card);border:1px solid var(--border);border-radius:.75rem;padding:1rem 1.25rem}summary{font-weight:600;cursor:pointer}
    footer{border-top:1px solid var(--border);padding:2.5rem 0;text-align:center}footer .logo-text{font-family:var(--font-display);font-size:1.5rem;margin-bottom:.5rem}footer .logo-text span{color:var(--accent)}footer p{color:var(--text-muted);font-size:.85rem}
    .wa-fab{position:fixed;bottom:1.25rem;right:1.25rem;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--whatsapp);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,211,102,.4)}
    .menu-toggle{display:flex;background:none;border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:.4rem;font-size:.85rem;cursor:pointer}@media(min-width:1024px){.menu-toggle{display:none}}
    .mobile-nav{display:none;flex-direction:column;gap:.75rem;padding:1rem 1.25rem;border-top:1px solid var(--border)}.mobile-nav.open{display:flex}
    .metric-value{font-family:var(--font-display);font-size:1.5rem;color:var(--primary)}.case-link{color:var(--accent);font-weight:600}.step-num{font-family:var(--font-display);font-size:2rem;color:var(--primary)}
    .socials{display:flex;align-items:center;gap:.55rem}
    .socials a{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);color:var(--text-muted);transition:color .15s,border-color .15s,background .15s}
    .socials a:hover{color:var(--accent);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
    .socials a svg{width:16px;height:16px;fill:currentColor}
    footer .socials{justify-content:center;margin:1rem 0 .75rem}
    footer .socials a{width:40px;height:40px}
    footer .socials a svg{width:18px;height:18px}
    @media(max-width:1023px){.header-socials{display:none}}
    .partner-badge{display:inline-flex;align-items:center;line-height:0}
    .partner-badge img{height:48px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 6px;border:1px solid var(--border)}
    .partner-badge:hover img{border-color:rgba(34,211,238,.4)}
    footer .partner-badge{margin:1rem auto .25rem;display:inline-flex}
    footer .partner-badge img{height:56px}
  </style>
